<style>
/* Layout: sidebar fixa no computador, barra de abas embaixo no celular; tudo gira em torno do mês selecionado */
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface-2:#f0eee9; --line:#e2ded5;
  --ink:#1c1a17; --muted:#6f685c; --gold:#a8823f; --gold-soft:#f3ead8;
  --in:#2f7d4f; --in-soft:#e3f1e8; --out:#b4462f; --out-soft:#f8e5df; --warn:#b7791f; --warn-soft:#fbefd6;
  --shadow:0 1px 2px rgba(40,32,20,.06),0 6px 20px rgba(40,32,20,.06);
  --f-display:'Bitter',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:12px; --mpos:#7fd6a1; --mneg:#ff9d88;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1d1b18; --surface-2:#26231f; --line:#34302a;
  --ink:#f1ede5; --muted:#a59d8f; --gold:#d6ae66; --gold-soft:#3a3123;
  --in:#5fbf86; --in-soft:#1f3328; --out:#e8806a; --out-soft:#3a231d; --warn:#e3a74a; --warn-soft:#3a2e1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --mpos:#2f7d4f; --mneg:#b4462f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1d1b18; --surface-2:#26231f; --line:#34302a;
  --ink:#f1ede5; --muted:#a59d8f; --gold:#d6ae66; --gold-soft:#3a3123;
  --in:#5fbf86; --in-soft:#1f3328; --out:#e8806a; --out-soft:#3a231d; --warn:#e3a74a; --warn-soft:#3a2e1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --mpos:#2f7d4f; --mneg:#b4462f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Login ---------- */
#auth{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:16px}
.auth-logo{background:#fff;border-radius:12px;padding:14px;display:grid;place-items:center}
.auth-logo img{width:100%;max-width:260px;height:auto;display:block}
.auth-card h1{font-size:20px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:46px}
.inp:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.err{color:var(--out);font-size:13px;min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:3px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.code{font-family:var(--f-num);font-size:22px;letter-spacing:.15em;text-align:center;background:var(--gold-soft);border-radius:10px;padding:14px;user-select:all}

/* ---------- App shell ---------- */
#app{min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#1c1a17}
.top .mark{width:36px;height:36px;border-radius:8px;background:#fff;overflow:hidden;flex:none}
.top .mark img{width:100%;height:100%;object-fit:cover}
.top .t{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.top .t small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:#c9b28a;letter-spacing:.08em;text-transform:uppercase}
.top .sp{flex:1}
.iconbtn{background:none;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.1)}
main{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto;display:grid;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--out);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;z-index:25;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#fff;box-shadow:0 6px 18px rgba(120,90,30,.35);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:240px 1fr}
  .top,.tabs,body::before{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--ink);color:#fff;padding:20px 14px}
  .side .brand{background:#fff;border-radius:12px;padding:10px;margin-bottom:14px}
  .side .brand img{width:100%;display:block}
  .side .nav{background:none;border:0;color:#d8d2c6;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;text-align:left;position:relative}
  .side .nav svg{width:20px;height:20px}
  .side .nav:hover{background:rgba(255,255,255,.07);color:#fff}
  .side .nav[aria-current="page"]{background:rgba(214,174,102,.16);color:#fff}
  .side .nav[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#d6ae66}
  .side .nav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--out);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px}
  .side .add{margin-top:10px;background:#d6ae66;color:#1c1a17;border:0}
  .side .add:hover{background:#e2be7b}
  .side .foot{margin-top:auto;font-size:12px;color:#8f877a;display:grid;gap:6px}
  .side .foot button{color:#d8d2c6;background:none;border:1px solid #3a352d;border-radius:8px;padding:8px;cursor:pointer;font-weight:600}
  .fab{display:none}
  main{padding-block:28px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* ---------- Pieces ---------- */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;flex:1;min-width:0}
.month{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.month button{background:none;border:0;width:40px;height:40px;cursor:pointer;color:var(--ink);font-size:18px}
.month span{min-width:132px;text-align:center;font-weight:700;text-transform:capitalize}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .muted{font-family:var(--f-body);font-size:12px;font-weight:500;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:clamp(16px,4.4vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.main .lbl,.kpi.main .s{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.pos{color:var(--in)} .neg{color:var(--out)}
.kpi.main .pos{color:var(--mpos)} .kpi.main .neg{color:var(--mneg)}
.grid2{display:grid;gap:16px}
@media (min-width:900px){.grid2{grid-template-columns:1.15fr 1fr}}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.donutwrap{display:grid;gap:16px;align-items:center}
@media (min-width:520px){.donutwrap{grid-template-columns:180px 1fr}}
.donut{width:180px;height:180px;margin:0 auto;display:block}
.legend{display:grid;gap:10px;min-width:0}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;font-size:14px;min-width:0}
.lg i{width:12px;height:12px;border-radius:3px}
.lg .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lg .bar{grid-column:2/4;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.lg .bar b{display:block;height:100%;border-radius:3px}
.lg .p{font-size:12px;color:var(--muted);margin-left:6px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);cursor:pointer;text-align:left;width:100%}
.alert b{color:var(--warn)}
.alert.bad{background:var(--out-soft);border-color:color-mix(in srgb,var(--out) 30%,transparent)}
.alert.bad b{color:var(--out)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rows{display:grid}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--f-body)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--out-soft);color:var(--out)} .pill.ok{background:var(--in-soft);color:var(--in)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);text-transform:capitalize}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .inp{width:auto;flex:1;min-width:140px;min-height:40px;padding:8px 12px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
.table td{padding:9px 6px;border-bottom:1px solid var(--line)}
.table td.r,.table th.r{text-align:right}
@media (max-width:520px){.table{font-size:13px}.table .num{font-size:12px}.table th,.table td{padding:8px 4px}}
.scroll{overflow-x:auto}
.trend{font-size:12px;font-weight:700}
.set{display:grid;gap:10px}
.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t{flex:1;min-width:180px}
.setrow .t span{display:block;font-size:13px;color:var(--muted)}
.setrow .t span.pill{display:inline-block;font-size:10.5px}
.catlist{display:flex;flex-wrap:wrap;gap:8px}
.catchip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:20px;background:var(--surface-2);font-size:13px;font-weight:600}
.catchip i{width:10px;height:10px;border-radius:50%}
.catchip button{border:0;background:none;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--muted)}
.catchip button:hover{background:var(--line);color:var(--out)}

.sync{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:inherit;cursor:pointer;font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#8f877a;flex:none}
.sync.ok i{background:#5fbf86}.sync.run i{background:#d6ae66;animation:pulse 1s infinite}.sync.err i{background:#e8806a}
@keyframes pulse{50%{opacity:.3}}
.top .sync span{display:none}
@media (min-width:430px){.top .sync span{display:inline;color:#c9b28a}}
.side .foot .sync{border:0;justify-content:flex-start;padding:4px 0;color:#d8d2c6}
.opt{display:grid;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;width:100%}
.opt:hover{border-color:var(--gold);background:var(--gold-soft)}
.opt span{font-size:13px;color:var(--muted)}
/* ---------- Sheet / modal ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,12,8,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .2s ease-out}
@media (min-width:700px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px}
.sheet header h3{flex:1;font-size:19px}
.typesw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.typesw button{border:0;border-radius:9px;padding:10px;font-weight:700;background:none;color:var(--muted);cursor:pointer}
.typesw button[data-on="entrada"][aria-pressed="true"]{background:var(--in);color:#fff}
.typesw button[data-on="saida"][aria-pressed="true"]{background:var(--out);color:#fff}
.valor{font-family:var(--f-num);font-size:30px;font-weight:600;text-align:center;border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding:6px;width:100%}
.valor:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button i{width:8px;height:8px;border-radius:50%}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.sample{font-size:12px;background:var(--gold-soft);color:var(--ink);padding:8px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>

function merge(rows){const idx=new Map(DB.lanc.map((x,i)=>[x.id,i]));const del=new Set();let diff=false;
  rows.forEach(r=>{if(Q[r.id])return;const i=idx.get(r.id);

    const ids=Object.keys(Q);
    for(let i=0;i<ids.length;i+=300){const part=ids.slice(i,i+300).map(id=>Q[id]).filter(Boolean);
      const {error}=await SB.from('lancamentos').upsert(part.map(toRow),{onConflict:'id'});if(error)throw error;
      part.forEach(p=>{if(Q[p.id]&&Q[p.id].upd===p.upd)delete Q[p.id]});saveQ()}
    // 2. categorias, formas de pagamento e histórico de backups
    const {data:cfg,error:ce}=await SB.from('config').select('dados,atualizado_em').eq('empresa_id',EMP.id).maybeSingle();if(ce)throw ce;
    if(META.cfgVer>META.cfgPushed||!cfg){const ver=META.cfgVer;
      const {data:up,error:ue}=await SB.from('config').upsert({empresa_id:EMP.id,dados:{cats:DB.cats,formas:DB.formas,backups:DB.backups}},{onConflict:'empresa_id'}).select('atualizado_em').single();
      if(ue)throw ue;META.cfgPushed=ver;META.cfgTs=up.atualizado_em}
    else if(!META.cfgTs||String(cfg.atualizado_em)>String(META.cfgTs)){const d=cfg.dados||{};
      if(d.cats)DB.cats=d.cats;if(d.formas)DB.formas=d.formas;DB.backups=d.backups||[];META.cfgTs=cfg.atualizado_em;changed=true}
    // 3. recebe o que mudou em outros aparelhos
    for(;;){let q=SB.from('lancamentos').select('*').eq('empresa_id',EMP.id).order('atualizado_em',{ascending:true}).order('id',{ascending:true}).limit(1000);
      if(META.since)q=q.or(`atualizado_em.gt."${META.since}",and(atualizado_em.eq."${META.since}",id.gt."${META.sinceId}")`);
      const {data,error}=await q;if(error)throw error;
      if(data.length){if(merge(data))changed=true;const last=data[data.length-1];META.since=last.atualizado_em;META.sinceId=last.id}
      if(data.length<1000)break}
    META.lastSync=Date.now();saveMeta();saveDB();setSync('ok');
  }catch(e){console.warn('sync',e);saveMeta();setSync(navigator.onLine?'err':'off',e&&e.message||String(e))}
  finally{syncing=false;if(again){again=false;schedSync(300)}else if(pend()&&SYNC.st==='ok')schedSync(800)}
  if(changed)softRender()}
function softRender(){if(!EMP)return;if(layerOpen){pendingRender=true;return}const a=document.activeElement;if(a&&a.id==='fBusca'){pendingRender=true;return}render()}

let fails=0,lockUntil=0;
// Login curto: "Cantinho@sistema" vira o e-mail interno "cantinho@sistema.com"
const SIS='sistema.com';
function loginToEmail(x){x=String(x||'').trim().toLowerCase().replace(/\s+/g,'');if(!x)return x;if(!x.includes('@'))x+='@sistema';const d=x.split('@')[1]||'';if(!d.includes('.'))x+='.com';return x}
const isSis=e=>String(e||'').toLowerCase().endsWith('@'+SIS);
const showLogin=e=>isSis(e)?e.replace('@'+SIS,'@sistema').replace(/^./,c=>c.toUpperCase()):e;
const authErr=e=>{const m=(e&&e.message)||'';if(/invalid login/i.test(m))return 'Login ou senha incorretos.';if(/not confirmed/i.test(m))return 'Este e-mail ainda não foi confirmado.';
  if(/fetch|network|load failed/i.test(m)||!navigator.onLine)return 'Sem conexão com a internet. Verifique e tente de novo.';if(/rate|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos.';return 'Não foi possível concluir: '+m};

function bkBanner(){if(!EMP||!DB.lanc.some(l=>!l.ex))return '';const last=META.lastBk||0;const d=last?Math.floor((Date.now()-last)/864e5):null;if(d!==null&&d<7)return '';
  return `<div class="sample"><span>${d===null?'Você ainda não fez nenhum backup.':`Seu último backup foi há ${d} dias.`} Uma cópia extra protege contra exclusões por engano.</span><button class="btn sm" data-bk>Backup Agora</button></div>`}
function backup(){const lanc=DB.lanc.filter(l=>!l.ex).map(({upd,...l})=>l);
  const d={app:'cantinho-caseiro',versao:2,empresa:EMP.nome,gerado:new Date().toISOString(),cats:DB.cats,formas:DB.formas,lanc};
  fileOut(`backup_cantinho-caseiro_${today()}.json`,new Blob([JSON.stringify(d)],{type:'application/json'}));META.lastBk=Date.now();saveMeta();toast(`Backup gerado com ${lanc.length} lançamento(s)`);render()}
function importFile(f){const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.lanc))throw 0}catch(e){return toast('Arquivo inválido. Escolha um backup gerado por este sistema.')}
  const lanc=d.lanc.filter(l=>l&&!l.ex&&l.id&&(l.tipo==='entrada'||l.tipo==='saida')&&/^\d{4}-\d\d-\d\d$/.test(l.data||'')&&+l.valor>0);
  if(!lanc.length)return toast('Este backup não tem lançamentos para importar.');
  const have=new Set(DB.lanc.map(l=>l.id));const novos=lanc.filter(l=>!have.has(l.id)).length;
  const quando=d.gerado?new Date(d.gerado).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'data não informada';
  const atuais=DB.lanc.filter(l=>!l.ex).length;
  const close=openLayer(`<div class="sheet"><header><h3>Importar backup</h3></header>
    <p style="margin:0"><b>${esc(f.name)}</b><br><span class="muted">Gerado em ${quando} · ${lanc.length} lançamento(s), ${novos} novo(s) para este sistema.</span></p>
    <button class="opt" id="imM"><b>Mesclar com os dados atuais</b><span>Adiciona só o que ainda não existe. Nada do que está no sistema é apagado.</span></button>
    <button class="opt" id="imS"><b>Substituir tudo</b><span>Apaga os ${atuais} lançamento(s) atuais e deixa só os do backup.</span></button>
    <button class="btn" id="imC">Cancelar</button></div>`);
  $('#imC').onclick=close;
  $('#imM').onclick=()=>{close();doImport(d,lanc,f.name,'mesclar')};
  $('#imS').onclick=()=>{close();confirmBox('Substituir todos os lançamentos?',`Os ${atuais} lançamento(s) atuais serão apagados da nuvem e trocados pelos ${lanc.length} do backup. Se tiver dúvida, faça um Backup Agora antes.`,'Substituir',()=>doImport(d,lanc,f.name,'substituir'))}};
  r.readAsText(f)}
function doImport(d,lanc,nome,modo){const bid='bk-'+uid();
  if(modo==='substituir')delMany(DB.lanc.filter(l=>!l.ex).map(l=>l.id));
  const have=new Set(DB.lanc.map(l=>l.id));
  const add=lanc.filter(l=>!have.has(l.id)).map(l=>({id:String(l.id),tipo:l.tipo,valor:Math.round(+l.valor*100)/100,data:l.data,cat:l.cat||'',forma:l.forma||'',canal:l.canal||'',forn:l.forn||'',desc:l.desc||'',
    status:l.status==='pendente'?'pendente':'pago',venc:l.venc||'',pagoEm:l.pagoEm||'',criado:+l.criado||Date.now(),backupId:bid}));
  ['saida','entrada'].forEach(t=>{const cur=new Set(DB.cats[t].map(c=>c.id));((d.cats||{})[t]||[]).forEach(c=>{if(c&&c.id&&!cur.has(c.id))DB.cats[t].push(c)})});
  (d.formas||[]).forEach(f=>{if(f&&!DB.formas.includes(f))DB.formas.push(f)});
  if(add.length)putMany(add);
  DB.backups=[{id:bid,arquivo:nome,em:new Date().toISOString(),modo,qtd:add.length,pulados:lanc.length-add.length},...(DB.backups||[])].slice(0,30);cfgChanged();
  toast(add.length?`${add.length} lançamento(s) importado(s)`:'Nada novo: todos os lançamentos já estavam no sistema');render()}
function undoImport(bid){const b=DB.backups.find(x=>x.id===bid);if(!b)return;const ids=DB.lanc.filter(l=>l.backupId===bid).map(l=>l.id);
  confirmBox('Desfazer esta importação?',`${ids.length} lançamento(s) que vieram de “${esc(b.arquivo)}” serão apagados.${b.modo==='substituir'?' Os lançamentos que existiam antes da substituição não voltam; para isso, importe o backup feito antes dela.':''}`,'Desfazer',()=>{

function vPainel(m){
  const r=resumo(UI.mes),ant=resumo(addMonth(UI.mes,-1));
  const marg=r.e?r.saldo/r.e*100:0;

  const t=today(),hojeL=DB.lanc.filter(l=>l.data===t&&l.tipo==='entrada');

  const ve=var_(r.e,ant.e),vs=var_(r.s,ant.s);
  const vtxt=(v,inv)=>v===null?'sem mês anterior':`<span class="${(inv?-v:v)>=0?'pos':'neg'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(0)}%</span> vs. ${MESES[addMonth(UI.mes,-1).split('-')[1]-1]}`;
  const urg=urgentes(),venc=urg.filter(l=>l.data<t);

function donut(fat,total){const R=62,C=2*Math.PI*R;let off=0;
  const segs=fat.map(([n,o])=>{const len=o.v/total*C;const s=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${o.cor}" stroke-width="26" stroke-dasharray="${Math.max(len-1.5,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(n)}: ${brl(o.v)}</title></circle>`;off+=len;return s}).join('');
  return `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Gastos por categoria">${segs}<text x="90" y="84" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--f-body)">Total de saídas</text><text x="90" y="104" text-anchor="middle" style="fill:var(--ink);font-size:12.5px;font-family:var(--f-num);font-weight:600">${brlK(total)}</text></svg>`}
function dailyChart(L){const[y,mo]=UI.mes.split('-').map(Number);const n=new Date(y,mo,0).getDate();
  const E=Array(n).fill(0),S=Array(n).fill(0);L.forEach(l=>{const d=+l.data.slice(8)-1;(l.tipo==='entrada'?E:S)[d]+=l.valor});
  const max=Math.max(...E,...S,1);const W=560,H=200,pl=44,pb=22,pt=8,cw=(W-pl-6)/n,bw=Math.max(cw/2-1,1.5);
  const nice=niceMax(max);const ys=[0,.5,1].map(f=>f*nice);const yy=v=>H-pb-(v/nice)*(H-pb-pt);
  let g=ys.map(v=>`<line x1="${pl}" x2="${W}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${yy(v)+3}" text-anchor="end">${v>=1000?(v/1000).toLocaleString('pt-BR')+'k':v}</text>`).join('');
  let b='';for(let i=0;i<n;i++){const x=pl+i*cw+1;if(E[i])b+=`<rect x="${x}" y="${yy(E[i])}" width="${bw}" height="${H-pb-yy(E[i])}" rx="1.5" fill="var(--in)"><title>Dia ${i+1} entradas: ${brl(E[i])}</title></rect>`;if(S[i])b+=`<rect x="${x+bw+1}" y="${yy(S[i])}" width="${bw}" height="${H-pb-yy(S[i])}" rx="1.5" fill="var(--out)"><title>Dia ${i+1} saídas: ${brl(S[i])}</title></rect>`;
    if(i===0||(i+1)%5===0)g+=`<text x="${x+cw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por dia">${g}${b}</svg>`}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}
function caixaHoje(L){if(!L.length)return `<div class="empty" style="padding:18px"><span>Nenhuma entrada registrada hoje.</span><button class="btn sm" id="cxAdd">Lançar venda de hoje</button></div>`;
  const by={};L.forEach(l=>by[l.forma||'Outros']=(by[l.forma||'Outros']||0)+l.valor);
  return `<table class="table"><tbody>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([f,v])=>`<tr><td>${esc(f)}</td><td class="r num">${brl(v)}</td></tr>`).join('')}<tr><td><b>Total do dia</b></td><td class="r num"><b>${brl(soma(L))}</b></td></tr></tbody></table><p class="muted" style="font-size:12px;margin:8px 0 0">Confira com a gaveta e a maquininha no fechamento.</p>`}

function sixChart(months,R){const W=560,H=220,pl=50,pb=24,pt=10;const max=niceMax(Math.max(...R.map(r=>Math.max(r.e,r.s)),1));

  let g=[lo,0,max/2,max].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<line x1="${pl}" x2="${W}" y1="${yy(v)}" y2="${yy(v)}" stroke="${v===0?'var(--muted)':'var(--line)'}" ${v===0?'stroke-opacity=".5"':''}/><text x="${pl-6}" y="${yy(v)+3}" text-anchor="end">${(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})}k</text>`).join('');
  let b='',pts=[];R.forEach((r,i)=>{const cx=pl+i*cw+cw/2;
    b+=`<rect x="${cx-bw-1}" y="${yy(r.e)}" width="${bw}" height="${yy(0)-yy(r.e)}" rx="2" fill="var(--in)"><title>Entradas: ${brl(r.e)}</title></rect><rect x="${cx+1}" y="${yy(r.s)}" width="${bw}" height="${yy(0)-yy(r.s)}" rx="2" fill="var(--out)"><title>Saídas: ${brl(r.s)}</title></rect><text x="${cx}" y="${H-6}" text-anchor="middle" style="text-transform:capitalize">${mesCurto(months[i])}</text>`;pts.push([cx,yy(r.saldo),r.saldo])});

function seed(){

      if(wd===2||wd===5)add({tipo:'saida',cat:S('Carnes e frios'),valor:Math.round(1450*f*(.85+rnd()*.3)),data:ds,forn:'Açougue Boi Gordo',forma:'Pix',desc:'Carnes da semana'});

    }
    const dd=n=>m+'-'+pad(n);const ok=n=>k>0||n<=+t.slice(8);
    const fix=(n,cat,v,o={})=>{if(ok(n))add({tipo:'saida',cat:S(cat),valor:v,data:dd(n),...o});else add({tipo:'saida',cat:S(cat),valor:v,data:dd(n),status:'pendente',...o})};
    fix(5,'Aluguel',3800,{forn:'Imobiliária Central',forma:'Boleto'});
    fix(5,'Salários',7200,{forma:'Transferência',desc:'Folha — 3 funcionários'});
    fix(10,'Energia',Math.round(1180*(.9+rnd()*.25)),{forn:'Companhia de energia',forma:'Boleto'});
    fix(12,'Água',Math.round(310*(.9+rnd()*.2)),{forn:'Saneamento',forma:'Boleto'});
    fix(15,'Internet e telefone',149,{forma:'Boleto'});
    fix(8,'Gás',Math.round(780*(.9+rnd()*.2)),{forn:'Gás Chama Azul',forma:'Pix',desc:'4 botijões P45'});
    fix(20,'Taxas de maquininha e apps',Math.round(1350*f*(.9+rnd()*.2)),{forn:'iFood / maquininha',forma:'Transferência'});
    fix(20,'Impostos',Math.round(1150*f),{forma:'Boleto',desc:'DAS Simples Nacional'});
    fix(18,'Descartáveis e embalagens',Math.round(560*(.9+rnd()*.2)),{forn:'Embalagens Real',forma:'Pix',desc:'Marmitas e sacolas'});
    fix(28,'Retirada do dono',3000,{forma:'Pix'});
    if(rnd()<.5)fix(14,'Manutenção e equipamentos',Math.round(450+rnd()*600),{forma:'Pix',desc:'Conserto da chapa'});
  }
  DB.lanc=DB.lanc.filter(l=>!l.ex).concat(out);saveDB();
}

/* ---------- Início ---------- */
async function boot(){
  if(!window.supabase||!window.supabase.createClient)return authView('msg',{t:'Sem conexão',m:'Não foi possível carregar o sistema. Verifique a internet e recarregue a página.',reload:true});
  if(!SB){SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'cc-auth'}});
    SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;authView('newpass')}})}
  authView('loading');let session=null;try{session=(await SB.auth.getSession()).data.session}catch(e){}
  if(recovering){if(session)authView('newpass');else authView('login');return}
  if(session)afterLogin(session);else authView('login')}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
